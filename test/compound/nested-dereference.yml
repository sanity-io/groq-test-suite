  - name: "A per-element filter does not preserve null"
    query: |
      (*[_type=="project"][].members[]->dept->)[budget > 500000].name
    result:
    - Engineering
    - Engineering

  - name: "Array traversal does not treat a non-array chain as an array"
    query: |
      *[_type=="project"][].members[]->dept->[budget > 500000].name
    result:
    - null
    - null
    - null

  - name: "Slice after a conditional dereferencing spread"
    query: |
      *[_type == "project" && name == "Website Redesign"][0].members[]{
