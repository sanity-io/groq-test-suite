name: "Nested references"
version: ">= 1.0"

documents:
- _id: image-customer-itch
  _type: image
  url: https://cdn.sanity.io/image-customer-itch.jpg
- _id: image-sprint-1
  _type: image
  url: https://cdn.sanity.io/image-sprint-1.jpg
- _id: image-sprint-2
  _type: image
  url: https://cdn.sanity.io/image-sprint-2.jpg
- _id: image-sprint-3
  _type: image
  url: https://cdn.sanity.io/image-sprint-3.jpg
- _id: image-phase-1
  _type: image
  url: https://cdn.sanity.io/image-phase-1.jpg
- _id: image-phase-2
  _type: image
  url: https://cdn.sanity.io/image-phase-2.jpg
- _id: image-phase-3
  _type: image
  url: https://cdn.sanity.io/image-phase-3.jpg
- _id: image-task-1
  _type: image
  url: https://cdn.sanity.io/image-task-1.jpg
- _id: image-task-2
  _type: image
  url: https://cdn.sanity.io/image-task-2.jpg
- _id: image-task-3
  _type: image
  url: https://cdn.sanity.io/image-task-3.jpg

- _id: task-1
  _type: task
  name: Task 1
- _id: task-2
  _type: task
  name: Task 2
- _id: task-3
  _type: task
  name: Task 3

- _id: phase-1
  _type: phase
  name: Phase 1
  image:
    asset:
      _type: reference
      _ref: image-phase-1
  tasks:
  - _type: reference
    _ref: task-1
  - _type: reference
    _ref: task-2
- _id: phase-2
  _type: phase
  name: Phase 2
  image:
    asset:
      _type: reference
      _ref: image-phase-2
  tasks:
  - _type: reference
    _ref: task-2
  - _type: reference
    _ref: task-3
- _id: phase-3
  _type: phase
  name: Phase 3
  image:
    asset:
      _type: reference
      _ref: image-phase-3
  tasks:
  - _type: reference
    _ref: task-1
  - _type: reference
    _ref: task-3

- _id: sprint-1
  _type: sprint
  name: Sprint 1
  image:
    asset:
      _type: reference
      _ref: image-sprint-1
  phases:
  - _type: reference
    _ref: phase-1
  - _type: reference
    _ref: phase-3
- _id: sprint-2
  _type: sprint
  name: Sprint 2
  image:
    asset:
      _type: reference
      _ref: image-sprint-2
  phases:
  - _type: reference
    _ref: phase-2
  - _type: reference
    _ref: phase-3
- _id: sprint-3
  _type: sprint
  name: Sprint 3
  image:
    asset:
      _type: reference
      _ref: image-sprint-3
  phases:
  - _type: reference
    _ref: phase-1
  - _type: reference
    _ref: phase-2
  - _type: reference
    _ref: phase-3

- _id: customer-itch
  _type: customer
  name: itch
  shortname: itch
  image:
    asset:
      _type: reference
      _ref: image-customer-itch
  sprints:
  - _type: reference
    _ref: sprint-1
  - _type: reference
    _ref: sprint-2
  - _type: reference
    _ref: sprint-3

tests:
- name: Expanded one level
  query: |
    *[_type=="customer" && name == "itch"]{
      name,
      "shortName": shortname,
      "image": image.asset->url,
      sprints[]->{
        name,
        "imageUrl": image.asset->url,
      }
    }[0]
  result:
    image: https://cdn.sanity.io/image-customer-itch.jpg
    name: itch
    shortName: itch
    sprints:
    - imageUrl: https://cdn.sanity.io/image-sprint-1.jpg
      name: Sprint 1
    - imageUrl: https://cdn.sanity.io/image-sprint-2.jpg
      name: Sprint 2
    - imageUrl: https://cdn.sanity.io/image-sprint-3.jpg
      name: Sprint 3

- name: Expanded two levels
  query: |
    *[_type=="customer" && name == "itch"]{
      name,
      "shortName": shortname,
      "image": image.asset->url,
      sprints[]->{
        name,
        "imageUrl": image.asset->url,
        phases[]->{
          name,
          "imageUrl": image.asset->url,
        }
      }
    }[0]
  result:
    image: https://cdn.sanity.io/image-customer-itch.jpg
    name: itch
    shortName: itch
    sprints:
    - imageUrl: https://cdn.sanity.io/image-sprint-1.jpg
      name: Sprint 1
      phases:
      - imageUrl: https://cdn.sanity.io/image-phase-1.jpg
        name: Phase 1
      - imageUrl: https://cdn.sanity.io/image-phase-3.jpg
        name: Phase 3
    - imageUrl: https://cdn.sanity.io/image-sprint-2.jpg
      name: Sprint 2
      phases:
      - imageUrl: https://cdn.sanity.io/image-phase-2.jpg
        name: Phase 2
      - imageUrl: https://cdn.sanity.io/image-phase-3.jpg
        name: Phase 3
    - imageUrl: https://cdn.sanity.io/image-sprint-3.jpg
      name: Sprint 3
      phases:
      - imageUrl: https://cdn.sanity.io/image-phase-1.jpg
        name: Phase 1
      - imageUrl: https://cdn.sanity.io/image-phase-2.jpg
        name: Phase 2
      - imageUrl: https://cdn.sanity.io/image-phase-3.jpg
        name: Phase 3

- name: Expanded three levels
  query: |
    *[_type=="customer" && name == "itch"]{
      name,
      "shortName": shortname,
      "image": image.asset->url,
      sprints[]->{
        name,
        "imageUrl": image.asset->url,
        phases[]->{
          name,
          "imageUrl": image.asset->url,
          tasks[]->{name}
        }
      }
    }[0]
  result:
    image: https://cdn.sanity.io/image-customer-itch.jpg
    name: itch
    shortName: itch
    sprints:
    - imageUrl: https://cdn.sanity.io/image-sprint-1.jpg
      name: Sprint 1
      phases:
      - imageUrl: https://cdn.sanity.io/image-phase-1.jpg
        name: Phase 1
        tasks:
        - name: Task 1
        - name: Task 2
      - imageUrl: https://cdn.sanity.io/image-phase-3.jpg
        name: Phase 3
        tasks:
        - name: Task 1
        - name: Task 3
    - imageUrl: https://cdn.sanity.io/image-sprint-2.jpg
      name: Sprint 2
      phases:
      - imageUrl: https://cdn.sanity.io/image-phase-2.jpg
        name: Phase 2
        tasks:
        - name: Task 2
        - name: Task 3
      - imageUrl: https://cdn.sanity.io/image-phase-3.jpg
        name: Phase 3
        tasks:
        - name: Task 1
        - name: Task 3
    - imageUrl: https://cdn.sanity.io/image-sprint-3.jpg
      name: Sprint 3
      phases:
      - imageUrl: https://cdn.sanity.io/image-phase-1.jpg
        name: Phase 1
        tasks:
        - name: Task 1
        - name: Task 2
      - imageUrl: https://cdn.sanity.io/image-phase-2.jpg
        name: Phase 2
        tasks:
        - name: Task 2
        - name: Task 3
      - imageUrl: https://cdn.sanity.io/image-phase-3.jpg
        name: Phase 3
        tasks:
        - name: Task 1
        - name: Task 3

- name: Expanded with nulls
  query: |
    *[_type=="customer" && name == "itch"]{
      name,
      "shortName": shortname,
      "image": image.asset->url,
      sprints[]->{
        name,
        "imageUrl": image.asset->url,
        phasesWithTypo[]->{
          name,
          "imageUrl": image.asset->url,
          tasks[]->{name}
        }
      }
    }[0]
  result:
    image: https://cdn.sanity.io/image-customer-itch.jpg
    name: itch
    shortName: itch
    sprints:
    - imageUrl: https://cdn.sanity.io/image-sprint-1.jpg
      name: Sprint 1
      phasesWithTypo: null
    - imageUrl: https://cdn.sanity.io/image-sprint-2.jpg
      name: Sprint 2
      phasesWithTypo: null
    - imageUrl: https://cdn.sanity.io/image-sprint-3.jpg
      name: Sprint 3
      phasesWithTypo: null

- name: With ordering
  query: |
    *[_type == "sprint"]{
      name,
      "phaseNames": phases|order(_ref desc)[]->name
    }
  result:
   - name: "Sprint 1"
     phaseNames: ["Phase 3", "Phase 1"]
   - name: "Sprint 2"
     phaseNames: ["Phase 3", "Phase 2"]
   - name: "Sprint 3"
     phaseNames: ["Phase 3", "Phase 2", "Phase 1"]

- name: With slicing
  query: |
    *[_type == "sprint"]{
      name,
      "phaseName0": phases[0...1]->{name, other->},
      "phaseName1": phases[1...2]->{name, other->}
    }
  result:
   - name: "Sprint 1"
     phaseName0:
     - name: "Phase 1"
       other: null
     phaseName1:
     - name: "Phase 3"
       other: null
   - name: "Sprint 2"
     phaseName0:
     - name: "Phase 2"
       other: null
     phaseName1:
     - name: "Phase 3"
       other: null
   - name: "Sprint 3"
     phaseName0:
     - name: "Phase 1"
       other: null
     phaseName1:
     - name: "Phase 2"
       other: null

- name: Chained in a projection
  documents:
  - _id: footer-1
    _type: footer
    text: "Copyright 2025"

  - _id: navbar-1
    _type: navbar
    brand: "Acme"

  - _id: layout-1
    _type: layout
    footer:
      _ref: footer-1
    navbar:
      _ref: navbar-1

  - _id: page-1
    _type: page
    layout:
      _ref: layout-1

  tests:
  - name: "Single dereference"
    query: |
      *[_id == "page-1"][0].layout -> { _id, footer, navbar }
    result:
      _id: layout-1
      footer:
        _ref: footer-1
      navbar:
        _ref: navbar-1

  - name: "Second-level dereference with attribute access"
    query: |
      *[_id == "page-1"][0].layout -> { "footerText": footer->text, "navBrand": navbar->brand }
    result:
      footerText: "Copyright 2025"
      navBrand: "Acme"

  - name: "Second-level dereference with a projection"
    query: |
      *[_id == "page-1"][0].layout -> { footer -> { _id, text }, navbar -> { _id, brand } }
    result:
      footer:
        _id: footer-1
        text: "Copyright 2025"
      navbar:
        _id: navbar-1
        brand: "Acme"

  - name: "Second-level dereference selecting only the id"
    query: |
      *[_id == "page-1"][0].layout -> { footer -> { _id }, navbar -> { _id } }
    result:
      footer:
        _id: footer-1
      navbar:
        _id: navbar-1

- name: Post, author and company graph
  documents:
  - _id: company-1
    _type: company
    name: Acme Corp
    country: US
    active: true

  - _id: company-2
    _type: company
    name: Globex
    country: UK
    active: true

  - _id: company-3
    _type: company
    name: Defunct Inc
    country: US
    active: false

  - _id: author-1
    _type: author
    name: Alice
    email: alice@example.com
    company:
      _ref: company-1
    minScore: 50

  - _id: author-2
    _type: author
    name: Bob
    email: bob@example.com
    company:
      _ref: company-2
    minScore: 70

  - _id: author-3
    _type: author
    name: Charlie
    email: charlie@example.com
    company:
      _ref: company-3
    minScore: 30

  - _id: post-1
    _type: post
    title: Hello World
    author:
      _ref: author-1
    category: tech
    score: 80
    tags:
    - intro
    - tutorial

  - _id: post-2
    _type: post
    title: Advanced GROQ
    author:
      _ref: author-1
    category: tech
    score: 95
    tags:
    - advanced
    - groq

  - _id: post-3
    _type: post
    title: UK News
    author:
      _ref: author-2
    category: news
    score: 60
    tags:
    - uk
    - news

  - _id: post-4
    _type: post
    title: Old Post
    author:
      _ref: author-3
    category: tech
    score: 40
    tags:
    - archive

  - _id: post-5
    _type: post
    title: Sports Update
    author:
      _ref: author-2
    category: sports
    score: 75
    tags:
    - sports

  tests:
  - name: "Simple dereference"
    query: |
      *[_type == "post"]{
        title,
        "author": author->
      } | order(title)
    result:
    - author:
        _id: author-1
        _type: author
        company:
          _ref: company-1
        email: alice@example.com
        minScore: 50
        name: Alice
      title: Advanced GROQ
    - author:
        _id: author-1
        _type: author
        company:
          _ref: company-1
        email: alice@example.com
        minScore: 50
        name: Alice
      title: Hello World
    - author:
        _id: author-3
        _type: author
        company:
          _ref: company-3
        email: charlie@example.com
        minScore: 30
        name: Charlie
      title: Old Post
    - author:
        _id: author-2
        _type: author
        company:
          _ref: company-2
        email: bob@example.com
        minScore: 70
        name: Bob
      title: Sports Update
    - author:
        _id: author-2
        _type: author
        company:
          _ref: company-2
        email: bob@example.com
        minScore: 70
        name: Bob
      title: UK News

  - name: "Dereference with a projection"
    query: |
      *[_type == "post"]{
        title,
        "author": author->{name, email}
      } | order(title)
    result:
    - author:
        email: alice@example.com
        name: Alice
      title: Advanced GROQ
    - author:
        email: alice@example.com
        name: Alice
      title: Hello World
    - author:
        email: charlie@example.com
        name: Charlie
      title: Old Post
    - author:
        email: bob@example.com
        name: Bob
      title: Sports Update
    - author:
        email: bob@example.com
        name: Bob
      title: UK News

  - name: "Chained dereference"
    query: |
      *[_type == "post"]{
        title,
        "authorName": author->name,
        "companyName": author->company->name,
        "companyCountry": author->company->country
      } | order(title)
    result:
    - authorName: Alice
      companyCountry: US
      companyName: Acme Corp
      title: Advanced GROQ
    - authorName: Alice
      companyCountry: US
      companyName: Acme Corp
      title: Hello World
    - authorName: Charlie
      companyCountry: US
      companyName: Defunct Inc
      title: Old Post
    - authorName: Bob
      companyCountry: UK
      companyName: Globex
      title: Sports Update
    - authorName: Bob
      companyCountry: UK
      companyName: Globex
      title: UK News

  - name: "Dereference in a filter"
    query: |
      *[_type == "post" && author->name == "Alice"]{
        title,
        "authorName": author->name
      } | order(title)
    result:
    - authorName: Alice
      title: Advanced GROQ
    - authorName: Alice
      title: Hello World

  - name: "Chained dereference in a filter"
    query: |
      *[_type == "post" && author->company->active == true]{
        title,
        "companyName": author->company->name
      } | order(title)
    result:
    - companyName: Acme Corp
      title: Advanced GROQ
    - companyName: Acme Corp
      title: Hello World
    - companyName: Globex
      title: Sports Update
    - companyName: Globex
      title: UK News

  - name: "Dereference of a missing document type"
    query: |
      *[_type == "post" || _type == "orphan"]{
        _id,
        title,
        "authorName": author->name,
        "hasAuthor": defined(author->name)
      } | order(_id)
    result:
    - _id: post-1
      authorName: Alice
      hasAuthor: true
      title: Hello World
    - _id: post-2
      authorName: Alice
      hasAuthor: true
      title: Advanced GROQ
    - _id: post-3
      authorName: Bob
      hasAuthor: true
      title: UK News
    - _id: post-4
      authorName: Charlie
      hasAuthor: true
      title: Old Post
    - _id: post-5
      authorName: Bob
      hasAuthor: true
      title: Sports Update

  - name: "Equality over a chained dereference"
    query: |
      *[_type == "post"]{
        title,
        "inUS": author->company->country == "US"
      } | order(title)
    result:
    - inUS: true
      title: Advanced GROQ
    - inUS: true
      title: Hello World
    - inUS: true
      title: Old Post
    - inUS: false
      title: Sports Update
    - inUS: false
      title: UK News

  - name: "select() over a chained dereference"
    query: |
      *[_type == "post"]{
        title,
        "region": select(
          author->company->country == "US" => "North America",
          author->company->country == "UK" => "Europe",
          "Other"
        )
      } | order(title)
    result:
    - region: North America
      title: Advanced GROQ
    - region: North America
      title: Hello World
    - region: North America
      title: Old Post
    - region: Europe
      title: Sports Update
    - region: Europe
      title: UK News

  - name: "Spread of a dereferenced projection"
    query: |
      *[_type == "post"]{
        title,
        score,
        "authorInfo": {
          ...author->{name, email}
        }
      } | order(title)
    result:
    - authorInfo:
        email: alice@example.com
        name: Alice
      score: 95
      title: Advanced GROQ
    - authorInfo:
        email: alice@example.com
        name: Alice
      score: 80
      title: Hello World
    - authorInfo:
        email: charlie@example.com
        name: Charlie
      score: 40
      title: Old Post
    - authorInfo:
        email: bob@example.com
        name: Bob
      score: 75
      title: Sports Update
    - authorInfo:
        email: bob@example.com
        name: Bob
      score: 60
      title: UK News

- name: Organization, department, employee and project graph
  documents:
  - _id: org-1
    _type: org
    name: MegaCorp

  - _id: org-2
    _type: org
    name: StartupXYZ

  - _id: dept-1
    _type: dept
    name: Engineering
    org:
      _ref: org-1
    budget: 1000000

  - _id: dept-2
    _type: dept
    name: Sales
    org:
      _ref: org-1
    budget: 500000

  - _id: dept-3
    _type: dept
    name: Product
    org:
      _ref: org-2
    budget: 200000

  - _id: emp-1
    _type: emp
    name: Eve
    dept:
      _ref: dept-1
    org:
      _ref: org-1
    salary: 100000

  - _id: emp-2
    _type: emp
    name: Frank
    dept:
      _ref: dept-1
    org:
      _ref: org-1
    salary: 90000

  - _id: emp-3
    _type: emp
    name: Grace
    dept:
      _ref: dept-2
    org:
      _ref: org-1
    salary: 80000

  - _id: emp-4
    _type: emp
    name: Henry
    dept:
      _ref: dept-3
    org:
      _ref: org-2
    salary: 95000

  - _id: project-1
    _type: project
    name: Website Redesign
    lead:
      _ref: emp-1
    members:
    - _ref: emp-1
    - _ref: emp-2

  - _id: project-2
    _type: project
    name: Mobile App
    lead:
      _ref: emp-4
    members:
    - _ref: emp-4

  - _id: portfolio-1
    _type: portfolio
    name: Test Portfolio
    items:
    - _key: item1
      project:
        _ref: project-1
    - _key: item2
      project:
        _ref: project-2

  - _id: ref-list
    _type: refList
    refs:
    - _ref: emp-1
    - _ref: missing-emp
      _weak: true

  - _id: array-target-a
    _type: arrayTargetTarget
    objects:
    - value: 1

  - _id: array-target-b
    _type: arrayTargetTarget
    objects:
    - value: 2
    - value: 4

  - _id: array-target-c
    _type: arrayTargetTarget
    objects:
    - value: 1
    - value: 3

  - _id: array-target-refs
    _type: arrayTargetRefs
    refs:
    - _ref: array-target-a
    - _ref: array-target-b
    - _ref: array-target-c

  - _id: array-target-root
    _type: arrayTargetRoot
    objects:
    - ref:
        _ref: array-target-refs

  tests:
  - name: "Array dereference"
    query: |
      *[_type == "project"]{
        name,
        "memberNames": members[]->name,
        "memberCount": count(members)
      } | order(name)
    result:
    - memberCount: 1
      memberNames:
      - Henry
      name: Mobile App
    - memberCount: 2
      memberNames:
      - Eve
      - Frank
      name: Website Redesign

  - name: "Array dereference with a projection"
    query: |
      *[_type == "project"]{
        name,
        "members": members[]->{name, salary}
      } | order(name)
    result:
    - members:
      - name: Henry
        salary: 95000
      name: Mobile App
    - members:
      - name: Eve
        salary: 100000
      - name: Frank
        salary: 90000
      name: Website Redesign

  - name: "Chained array dereference"
    query: |
      *[_type == "project"]{
        name,
        "memberDepts": members[]->{
          name,
          "deptName": dept->name,
          "deptBudget": dept->budget
        }
      } | order(name)
    result:
    - memberDepts:
      - deptBudget: 200000
        deptName: Product
        name: Henry
      name: Mobile App
    - memberDepts:
      - deptBudget: 1000000
        deptName: Engineering
        name: Eve
      - deptBudget: 1000000
        deptName: Engineering
        name: Frank
      name: Website Redesign

  - name: "Filter on a grouped array dereference"
    query: |
      *[_type == "project"]{
        name,
        "highPaidMembers": (members[]->)[ salary > 90000 ]{name, salary}
      } | order(name)
    result:
    - highPaidMembers:
      - name: Henry
        salary: 95000
      name: Mobile App
    - highPaidMembers:
      - name: Eve
        salary: 100000
      name: Website Redesign

  - name: "Filter directly after an array dereference maps per element"
    query: |
      *[_type == "project"]{
        name,
        "highPaidMembers": members[]->[ salary > 90000 ]{name, salary}
      } | order(name)
    result:
    - highPaidMembers: [null]
      name: Mobile App
    - highPaidMembers: [null, null]
      name: Website Redesign

  - name: "A grouped array dereference filter drops unresolved references"
    query: |
      (*[_id == "ref-list"][0].refs[]->)[salary > 90000]{name}
    result:
    - name: Eve

  - name: "Element access after an array dereference maps per element"
    query: |
      *[_id == "array-target-root"][0].objects[ref._ref == "array-target-refs"][].ref->refs[]->objects[value in [1,3]][1].value
    result:
    - null
    - null
    - 3

  - name: "Nested dereference in an object projection"
    query: |
      *[_type == "project" && _id == "project-1"][0]{
        _id,
        name,
        "members": [...members[]->{
          _id,
          name,
          "dept": dept->{
            _id,
            name,
            "org": org->{
              _id,
              name
            }
          }
        }][defined(_id)]
      }
    result:
