name: "Projection expression"
version: ">= 1.0"

documents:
- _id: "a"
  _type: "test"
  name: "A"
  other:
    _ref: "b"
  weakother:
    _ref: "b"
    _weak: true
  others:
  - _ref: "e"
  - _ref: "c"
  - _ref: "b"
  - _ref: "d"
- _id: "b"
  _type: "test"
  name: "B"
  other:
    _ref: "c"
  weakother:
    _type: "reference"
    _ref: "c"
    _weak: true
- _id: "c"
  _type: "test"
  name: "C"
  other:
    _ref: "e"
- _id: "d"
  _type: "test"
  name: "D"
- _id: "e"
  _type: "test"
  name: "E"
- _id: "id"
  _type: "values"
  v_array: [1, "string", true, null, [1, 2, 3], {"key": "value"}]
  v_decimal: 3.14
  v_false: false
  v_integer: 1
  v_object: {
    "v_array": ["a", "b", "c"],
    "v_boolean": true,
    "v_decimal": 2.718,
    "v_integer": 2,
    "v_object": {"k": "v"},
    "v_string": "abc"
  }
  v_ref:
    _ref: "a"
    _type: "reference"
  v_string: "string"
  v_true: true
- _id: "1"
  _type: "number"
  numberValue: 1
- _id: "2"
  _type: "number"
  numberValue: 2
- _id: "3"
  _type: "string"
  stringValue: "three"
- _id: "4"
  _type: "string"
  stringValue: "four"

tests:
- name: "Various values"
  query: |
    *[_id=="id"]{
      "attr_array": v_array,
      "attr_array_2": v_array[2],
      "attr_array_6": v_array[6],
      "attr_decimal": v_decimal,
      "attr_false": v_false,
      "attr_integer": v_integer,
      "attr_missing": missing,
      "attr_object": v_object,
      "attr_object_array": v_object.v_array,
      "attr_object_array_2": v_object.v_array[2],
      "attr_object_array_6": v_object.v_array[6],
      "attr_object_boolean": v_object.v_boolean,
      "attr_object_decimal": v_object.v_decimal,
      "attr_object_integer": v_object.v_integer,
      "attr_object_object": v_object.v_object,
      "attr_object_object_k": v_object.v_object.k,
      "attr_object_object_missing": v_object.v_object.missing,
      "attr_object_string": v_object.v_string,
      "attr_string": v_string,
      "attr_true": v_true,
      "attr__id": _id,
    }
  result:
  - attr__id: id
    attr_array: [1, "string", true, null, [1, 2, 3], {"key": "value"}]
    attr_array_2: true
    attr_array_6: null
    attr_decimal: 3.14
    attr_false: false
    attr_integer: 1
    attr_missing: null
    attr_object:
      v_array: ["a", "b", "c"]
      v_boolean: true
      v_decimal: 2.718
      v_integer: 2
      v_object: {"k": "v"}
      v_string: abc
    attr_object_array: ["a", "b", "c"]
    attr_object_array_2: "c"
    attr_object_array_6: null
    attr_object_boolean: true
    attr_object_decimal: 2.718
    attr_object_integer: 2
    attr_object_object: {"k": "v"}
    attr_object_object_k: "v"
    attr_object_object_missing: null
    attr_object_string: "abc"
    attr_string: "string"
    attr_true: true

- name: "Create nested object"
  query: |
    *[_id=="id"]{
      "nested": {
        "integer": v_integer,
        "deeper": {
          "string": v_string,
          "object": v_object.v_object,
        }
      },
    }
  result:
  - nested:
      deeper:
        object:
          k: v
        string: string
      integer: 1

- name: "After slice"
  query: |
    *[_type=="test"][0..2]~expr~
  tests:
    - variables: {expr: "{_id, name}"}
      result:
      - _id: a
        name: A
      - _id: b
        name: B
      - _id: c
        name: C
    - variables: {expr: '{"label": name}'}
      result:
      - label: A
      - label: B
      - label: C
    - variables: {expr: '{"name": _id}'}
      result:
      - name: a
      - name: b
      - name: c

- name: "Dereference"
  query: |
    *[_type=="test"]{"other": other->_id}
  result:
  - {other: b}
  - {other: c}
  - {other: e}
  - {other: null}
  - {other: null}

- name: "Splat"
  query: |
    *[_id=="c"]{...}
  result:
  - _id: "c"
    _type: "test"
    name: "C"
    other:
      _ref: "e"

- name: "Splat with extra parameters"
  query: |
    *[_id=="c"]{..., "label": name}
  result:
  - _id: "c"
    _type: "test"
    name: "C"
    label: "C"
    other:
      _ref: "e"

- name: "Splat with overriding parameters"
  query: |
    *[_id=="c"]{"name": "A", ..., "other": name}
  result:
  - _id: "c"
    _type: "test"
    name: "C"
    other: "C"

- name: "Splat object"
  query: |
    *[_id=="c"]{...{"label": name}}
  result:
  - label: "C"

- name: "Documents, conditionals"
  query: |
    *[_type in ["number", "string"]]{
      _type == "number" => {
        "v": numberValue
      },
      _type == "string" => {
        "v": stringValue
      }
    }
  result:
  - v: 1
  - v: 2
  - v: three
  - v: four

- name: "Documents, conditionals overlap"
  query: |
    *[_type in ["number", "string"]]{
      _type == "number" => {
        "v": numberValue,
        "number": 0
      },
      _type == "number" => {
        "number": numberValue
      }
    }
  result:
  - v: 1
    number: 1
  - v: 2
    number: 2
  - {}
  - {}

- name: "Documents nested"
  query: |
    *[_id=="a"][0]{_id, others{_ref}}
  result:
    _id: a
    others: null

- name: "Documents nested 2"
  query: |
    *[_id=="a"][0]{_id, others[]{_ref}}
  result:
    _id: a
    others:
    - _ref: e
    - _ref: c
    - _ref: b
    - _ref: d

- name: "Documents multiple"
  query: |
    *[_id=="id"]{
        v_integer,
        "string": v_string,
    }{...}{
      "integer": v_integer,
      string,
      v_true,
    }

- name: "Documents, object LHS"
  query: |
    *[_id == "id"][0].v_object{v_boolean}
  result:
    v_boolean: true

- name: "Documents, boolean LHS"
  query: |
    *[_id == "id"][0].v_object.v_boolean{"value": !@}
  result: null

- name: "Literals"
  query: |
    [{"v": 1}, {"v": 2}, {"v": 3}]
    {
      v,
      "string": "abc",
      "again": v,
      "missing": missing,
    }
  result:
  - v: 1
    string: abc
    again: 1
    missing: null
  - v: 2
    string: abc
    again: 2
    missing: null
  - v: 3
    string: abc
    again: 3
    missing: null

- name: "Literals, missing"
  query: |
    [{"v": 1}]
    {
      v,
      "string": "abc",
      "again": v,
      "missing": missing,
    }

  result:
  - v: 1
    string: abc
    again: 1
    missing: null

- title: "Literals multiple"
  query: |
    [{"v": 1}, {"v": 2}, {"v": 3}]
    {"value": v}[0..1]{"again": value}
  result:
  - again: 1
  - again: 2

- name:
  query: |
    [{"v": 1}]
    {"v": 1}{"value": v}{"again": value}
  result:
  - again: 1

- name: "Null literal"
  query: |
    null {
      something,
      "key": value,
      "stuff": stuff->stuff,
      "dogs": dogs[]->{cat}
    }
  result: null

- name: "Missing document"
  query: |
    *[doesNotExist == true][0]{
      something,
      "key": value,
      "stuff": stuff->stuff,
      "dogs": dogs[]->{cat}
    }
  result: null

- name: "Null parent scoping"
  query: |
    *[_id == "a"]{"a": ^.a}
  result:
  - {a: null}

- name: "Parent scoping"
  query: |
    *[_id == "a"]{
      other->{
        "a": _id,
        "b": ^._id,
      }
    }
  result:
  - other:
      a: "b"
      b: "a"

- name: "Grand parent scoping"
  query: |
    *[_id == "a"]{
      other->{
        other->{
          "a": _id,
          "b": ^._id,
          "c": ^.^._id,
        }
      }
    }
  result:
  - other:
      other:
        a: "c"
        b: "b"
        c: "a"

- name: "Grand parent scoping"
  query: |
    *[_id == "a"]{
      _id,
      "reverse": *[_id == ^.other._ref]{
        _id,
        "grandparent": *[_id == ^.^._id][0]._id
      }
    }
  result:
  - _id: "a"
    reverse:
    - _id: "b"
      grandparent: "a"

- name: "Projection after array traversal"
  query: |
    [[1, 2], [3, 4]][]{"values": @}
  result:
  - null
  - null

- name: "Conditional spread"
  documents:
  - _id: doc1
    _type: test
    title: Test Document
    nested:
      a: 1
      b: 2
      c: 3

  - _id: doc2
    _type: test
    title: Another Document
    nested:
      x: 10
      y: 20

  - _id: doc3
    _type: test
    title: Third Document
    flag: true
    nested:
      p: 100
      q: 200

  - _id: doc4
    _type: pageTest
    pageBuilder:
    - _key: builder1
      _type: sectionRichText
      content:
        en:
        - _key: block1
          _type: block
          style: normal
          markDefs: []
          children:
          - _key: span1
            _type: span
            text: Hello

  - _id: lesson1
    _type: lesson
    content:
    - _key: task1
      _type: block
      listItem: task

  tests:
  - name: "True condition"
    query: |
      *[_type == "test"] { _id, "n": nested { a, true => { ... } } } | order(_id)
    result:
    - _id: doc1
      n:
        a: 1
        b: 2
        c: 3
    - _id: doc2
      n:
        a: null
        x: 10
        y: 20
    - _id: doc3
      n:
        a: null
        p: 100
        q: 200

  - name: "False condition"
    query: |
      *[_type == "test"] { _id, "n": nested { a, false => { ... } } } | order(_id)
    result:
    - _id: doc1
      n:
        a: 1
    - _id: doc2
      n:
        a: null
    - _id: doc3
      n:
        a: null

  - name: "Condition reading a field"
    query: |
      *[_type == "test" && _id == "doc3"] { _id, flag => { title } }
    result:
    - _id: doc3
      title: Third Document

  - name: "Only a spread"
    query: |
      *[_type == "test" && _id == "doc1"] { _id, "first": nested { true => { ... } } }
    result:
    - _id: doc1
      first:
        a: 1
        b: 2
        c: 3

  - name: "Spread with an extra field"
    query: |
      *[_type == "test" && _id == "doc1"] { _id, "n": nested { true => { ..., "doubled": a * 2 } } }
    result:
    - _id: doc1
      n:
        a: 1
        b: 2
        c: 3
        doubled: 2

  - name: "Preserves the parent scope"
    query: |
      *[_id == "lesson1"][0] {
        content[] {
          listItem == "task" => {
            ...,
            "documentId": ^._id,
            "documentType": ^._type
          }
        }
      }
    result:
      content:
      - _key: task1
        _type: block
        listItem: task
        documentId: lesson1
        documentType: lesson

  - name: "Nested conditional spread"
    query: |
      *[_type == "test" && _id == "doc1"] { _id, true => { true => { "x": 1 } } }
    result:
    - _id: doc1
      x: 1

  - name: "Nested conditional spread reading a field"
    query: |
      *[_type == "test" && _id == "doc3"] { _id, flag => { flag => { title } } }
    result:
    - _id: doc3
      title: Third Document

  - name: "Nested conditional spread, inner false"
    query: |
      *[_type == "test" && _id == "doc1"] { _id, true => { false => { "x": 1 } } }
    result:
    - _id: doc1

  - name: "Nested conditional spread, outer false"
    query: |
      *[_type == "test" && _id == "doc1"] { _id, false => { true => { "x": 1 } } }
    result:
    - _id: doc1

  - name: "Spread preserves fields when overriding an empty array field"
    query: |
      *[_type == "pageTest" && _id == "doc4"][0]{
        pageBuilder[]{
          _type == "sectionRichText" => {
            _type,
            _key,
            "content": content.en[]{
              ...{
                ...,
                markDefs[]{...}
              }
            }[0]
          }
        }[0]
      }
    result:
      pageBuilder:
        _key: builder1
        _type: sectionRichText
        content:
          _key: block1
          _type: block
          style: normal
          markDefs: []
          children:
          - _key: span1
            _type: span
            text: Hello

- name: "Missing fields and object keys"
  documents:
  - _id: page-1
    _type: page
    title: Home Page
    slug:
      _type: slug
      current: home

  - _id: page-2
    _type: page
    title: About Page
    slug:
      _type: slug
      current: about

  - _id: person-1
    _type: person
    name: Alice
    age: 30
    email: alice@example.com

  - _id: person-2
    _type: person
    name: Bob
    age: 25
    email: bob@example.com

  - _id: campaign-1
    _type: campaign
    name: Summer Sale

  - _id: campaign-2
    _type: campaign
    name: Winter Promo

  tests:
  - name: "Nested field path"
    query: |
      *[_type == "page"]{
        title,
        "slugValue": slug.current
      } | order(title)
    result:
    - slugValue: about
      title: About Page
    - slugValue: home
      title: Home Page

  - name: "Nested object is preserved"
    query: |
      *[_type == "page"]{
        title,
        slug
      } | order(title)
    result:
    - slug:
        _type: slug
        current: about
      title: About Page
    - slug:
        _type: slug
        current: home
      title: Home Page

  - name: "A missing field projects as null"
    query: |
      *[_type == "page"] | order(_id){
        _id,
        title,
        subtitle
      }
    result:
    - _id: page-1
      subtitle: null
      title: Home Page
    - _id: page-2
      subtitle: null
      title: About Page

  - name: "Splat with a computed field"
    query: |
      *[_type == "person"]{
        ...,
        "upperName": upper(name)
      } | order(name)
    result:
    - _id: person-1
      _type: person
      age: 30
      email: alice@example.com
      name: Alice
      upperName: ALICE
    - _id: person-2
      _type: person
      age: 25
      email: bob@example.com
      name: Bob
      upperName: BOB

  - name: "Object at the root containing a subquery"
    query: |
      {"resource": *[_id == "campaign-1"][0]}
    result:
      resource:
        _id: campaign-1
        _type: campaign
        name: Summer Sale

  - name: "Conditional spread that matches"
    query: |
      *[_type == "campaign"]{
        _type == "campaign" => {name}
      } | order(name)
    result:
    - name: Summer Sale
    - name: Winter Promo

  - name: "Conditional spread that does not match"
    query: |
      *[_type == "campaign"]{
        _type == "product" => {name}
      } | order(_id)
    result:
    - {}
    - {}

  - name: "Limit after a non-pushable comparison"
    query: |
      *[_type == "page" && _id > "page-1"] | order(_id)[0...10]._id
    result:
    - page-2

  - name: "Limit after an equality"
    query: |
      *[_type == "page"] | order(_id)[0...1]._id
    result:
    - page-1