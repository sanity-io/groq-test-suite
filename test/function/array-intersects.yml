name: "array::intersects() function"
version: ">= 1.2"

tests:
- name: Invalid left
  query: |
    array::intersects(~expr~, [1, 2, 3])
  result: null
  tests:
  - variables: {expr: '42'}
  - variables: {expr: '"foo"'}
  - variables: {expr: 'true'}
  - variables: {expr: 'false'}
  - variables: {expr: 'null'}
  - variables: {expr: '{"a": 42}'}
  - variables: {expr: 'geo({"lat": 1, "lng": 1})'}
    features:
      - geoFunctions

# Exactly the same as previous, except reversed order of arguments
- name: Invalid right
  query: |
    array::intersects([1, 2, 3], ~expr~)
  result: null
  tests:
  # Non-array primitives
  - variables: {expr: '42'}
  - variables: {expr: '"foo"'}
  - variables: {expr: 'true'}
  - variables: {expr: 'false'}
  - variables: {expr: 'null'}
  # Non-array object
  - variables: {expr: '{"a": 42}'}
  # Non-array geo
  - variables: {expr: 'geo({"lat": 1, "lng": 1})'}
    features:
      - geoFunctions

- name: Non-primitves
  query: |
    array::intersects(~expr~, ~expr~)
  result: false
  tests:
  # Arrays of primitives
  - variables: {expr: '[[]]'}
  - variables: {expr: '[[1]]'}
  - variables: {expr: '[["foo"]]'}
  - variables: {expr: '[[null]]'}
  - variables: {expr: '[[false]]'}
  - variables: {expr: '[[true]]'}
  # Array of object
  - variables: {expr: '[{"a": 42}]'}
  # Array of geo
  - variables: {expr: '[geo({"lat": 1, "lng": 1})]'}
    features:
      - geoFunctions

- name: Array right
  query: |
    array::intersects(~arr~, ~lit~)
  variables:
    lit: '[1, "1", null, true, false, {"a": 42}]'
  tests:
  # Equal
  - result: true
    variables:
      arr: '[1, "1", null, true, false, {"a": 42}]'
  # Superset
  - result: true
    variables:
      arr: '[1, "1", null, true, false, {"a": 42}, "2"]'
  # Subset
  - result: true
    variables:
      arr:
      - '[1]'
      - '["1"]'
      - '[null]'
      - '[true]'
      - '[false]'
  # Overlapping
  - result: true
    variables:
      arr:
      - '[1, 2]'
      - '["1", "2"]'
      - '[null, 0]'
      - '[true, 0]'
      - '[false, 0]'
  # Disjoint
  - result: false
    variables:
      arr:
      - '[2]'
      - '["2"]'

# Exactly the same as previous, except reversed order of arguments
- name: Array left
  query: |
    array::intersects(~lit~, ~arr~)
  variables:
    lit: '[1, "1", null, true, false, {"a": 42}]'
  tests:
  # Equal
  - result: true
    variables:
      arr: '[1, "1", null, true, false, {"a": 42}]'
  # Superset
  - result: true
    variables:
      arr: '[1, "1", null, true, false, {"a": 42}, "2"]'
  # Subset
  - result: true
    variables:
      arr:
      - '[1]'
      - '["1"]'
      - '[null]'
      - '[true]'
      - '[false]'
  # Overlapping
  - result: true
    variables:
      arr:
      - '[1, 2]'
      - '["1", "2"]'
      - '[null, 0]'
      - '[true, 0]'
      - '[false, 0]'
  # Disjoint
  - result: false
    variables:
      arr:
      - '[2]'
      - '["2"]'

- name: Datetimes right
  query: |
    array::intersects(~arr~, ~lit~)
  variables:
    lit: '[dateTime("1900-01-01T00:00:00Z"), dateTime("1901-01-01T00:00:00Z"), dateTime("1902-01-01T00:00:00Z")]'
  tests:
  # Equal
  - result: true
    variables:
      arr: '[dateTime("1900-01-01T00:00:00Z"), dateTime("1901-01-01T00:00:00Z"), dateTime("1902-01-01T00:00:00Z")]'
  # Superset
  - result: true
    variables:
      arr: '[dateTime("1900-01-01T00:00:00Z"), dateTime("1901-01-01T00:00:00Z"), dateTime("1902-01-01T00:00:00Z"), dateTime("1903-01-01T00:00:00Z"), "not a date"]'
  # Subset
  - result: true
    variables:
      arr:
      - '[dateTime("1901-01-01T00:00:00Z")]'
  # Overlapping
  - result: true
    variables:
      arr:
      - '[dateTime("1900-01-01T00:00:00Z"), dateTime("1903-01-01T00:00:00Z")]'
  # Disjoint
  - result: false
    variables:
      arr:
      - '["x"]'
      - '[dateTime("1903-01-01T00:00:00Z")]'
      - '["1900-01-01T00:00:00Z"]'

# Exactly the same as previous, except reversed order of arguments
- name: Datetimes left
  query: |
    array::intersects(~lit~, ~arr~)
  variables:
    lit: '[dateTime("1900-01-01T00:00:00Z"), dateTime("1901-01-01T00:00:00Z"), dateTime("1902-01-01T00:00:00Z")]'
  tests:
  # Equal
  - result: true
    variables:
      arr: '[dateTime("1900-01-01T00:00:00Z"), dateTime("1901-01-01T00:00:00Z"), dateTime("1902-01-01T00:00:00Z")]'
  # Superset
  - result: true
    variables:
      arr: '[dateTime("1900-01-01T00:00:00Z"), dateTime("1901-01-01T00:00:00Z"), dateTime("1902-01-01T00:00:00Z"), dateTime("1903-01-01T00:00:00Z"), "not a date"]'
  # Subset
  - result: true
    variables:
      arr:
      - '[dateTime("1901-01-01T00:00:00Z")]'
  # Overlapping
  - result: true
    variables:
      arr:
      - '[dateTime("1900-01-01T00:00:00Z"), dateTime("1903-01-01T00:00:00Z")]'
  # Disjoint
  - result: false
    variables:
      arr:
      - '["x"]'
      - '[dateTime("1903-01-01T00:00:00Z")]'
      - '["1900-01-01T00:00:00Z"]'

- name: Document-relative arguments
  documents:
  - _id: a1
    _type: article
    title: First
    tags:
    - _ref: t1
      _weak: true
    - _ref: t2
      _weak: true
  - _id: a2
    _type: article
    title: Second
    tags:
    - _ref: t2
      _weak: true
    - _ref: t3
      _weak: true
  - _id: a3
    _type: article
    title: Third
    tags:
    - _ref: t4
      _weak: true
  - _id: a4
    _type: article
    title: NoTags
  tests:
  - name: "Document-relative left, literal right"
    query: |
      *[_type == "article" && array::intersects(tags[]._ref, ["t1", "t4"])] | order(_id) {_id}
    result:
    - {_id: a1}
    - {_id: a3}

  - name: "Literal left, document-relative right"
    query: |
      *[_type == "article" && array::intersects(["t3", "t2"], tags[]._ref)] | order(_id) {_id}
    result:
    - {_id: a1}
    - {_id: a2}

  - name: "Empty literal never intersects"
    query: |
      *[_type == "article" && array::intersects(tags[]._ref, [])] | order(_id) {_id}
    result: []

- name: Correlated arguments
  documents:
  - _id: root-number
    _type: root
    wanted:
    - 2
  - _id: root-string
    _type: root
    wanted:
    - value
  - _id: root-boolean
    _type: root
    wanted:
    - true
  - _id: root-null
    _type: root
    wanted:
    - null
  - _id: root-mixed
    _type: root
    wanted:
    - value
    - 2
    - key: composite
  - _id: root-scalar
    _type: root
    wanted: value
  - _id: item-a
    _type: item
    values:
    - 1
    - 2
  - _id: item-b
    _type: item
    values:
    - false
    - true
  - _id: item-c
    _type: item
    values:
    - null
  - _id: item-d
    _type: item
    values:
    - value
  - _id: item-composite
    _type: item
    values:
    - key: composite
  - _id: target-number
    _type: target
    code: 2
  - _id: target-string
    _type: target
    code: value
  - _id: linked-number
    _type: linkedItem
    targets:
    - _ref: target-number
  - _id: linked-string
    _type: linkedItem
    targets:
    - _ref: target-string
  tests:
  - name: "Keeps numbers"
    query: '*[_id == "root-number"][0]{"items": *[_type == "item" && array::intersects(values[], ^.wanted)] | order(_id)._id}.items'
    result:
    - item-a

  - name: "Keeps strings"
    query: '*[_id == "root-string"][0]{"items": *[_type == "item" && array::intersects(values[], ^.wanted)] | order(_id)._id}.items'
    result:
    - item-d

  - name: "Keeps booleans"
    query: '*[_id == "root-boolean"][0]{"items": *[_type == "item" && array::intersects(values[], ^.wanted)] | order(_id)._id}.items'
    result:
    - item-b

  - name: "Mixed values preserve exact semantics"
    query: '*[_id == "root-mixed"][0]{"items": *[_type == "item" && array::intersects(values[], ^.wanted)] | order(_id)._id}.items'
    result:
    - item-a
    - item-d

  - name: "Rejects a scalar argument"
    query: '*[_id == "root-scalar"][0]{"items": *[_type == "item" && array::intersects(values[], ^.wanted)] | order(_id)._id}.items'
    result: []

  - name: "Through a dereference, keeps numbers"
    query: '*[_id == "root-number"][0]{"items": *[_type == "linkedItem" && array::intersects(targets[]->code, ^.wanted)] | order(_id)._id}.items'
    result:
    - linked-number

  - name: "Through a dereference, mixed values preserve exact semantics"
    query: '*[_id == "root-mixed"][0]{"items": *[_type == "linkedItem" && array::intersects(targets[]->code, ^.wanted)] | order(_id)._id}.items'
    result:
    - linked-number
    - linked-string

- name: Correlated single-element literals
  documents:
  - _id: "p-1"
    _type: "parent"
    tag: "red"
  - _id: "p-2"
    _type: "parent"
    tag: "blue"
  - _id: "p-3"
    _type: "parent"
    tag: "green"
  - _id: "c-1"
    _type: "child"
    parent_tag: "red"
  - _id: "c-2"
    _type: "child"
    parent_tag: "blue"
  - _id: "c-3"
    _type: "child"
    parent_tag: "green"
  - _id: "c-4"
    _type: "child"
    parent_tag: "red"
  query: |
    *[_type == "parent"] | order(_id) {
      _id,
      "children": *[_type == "child" && array::intersects([parent_tag], [^.tag])] | order(_id) { _id }
    }
  result:
  - _id: "p-1"
    children:
    - _id: "c-1"
    - _id: "c-4"
  - _id: "p-2"
    children:
    - _id: "c-2"
  - _id: "p-3"
    children:
    - _id: "c-3"
