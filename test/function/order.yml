- name: "Relative to projections and slices"
  version: ">= 1.0"
  documents:
  - _id: projection-1
    _type: projectionOrder
    title: First
    rank: 1

  - _id: projection-2
    _type: projectionOrder
    title: Second
    rank: 3

  - _id: projection-3
    _type: projectionOrder
    title: Third
    rank: 2

  - _id: slice-1
    _type: sliceOrder
    rank: 1

  - _id: slice-2
    _type: sliceOrder
    rank: 3

  - _id: slice-3
    _type: sliceOrder
    rank: 2

  - _id: slice-4
    _type: sliceOrder
    rank: 100

  tests:
  - name: "After a projection, only projected values are visible"
    query: |
      *[_type == "projectionOrder"]{_id, title} | order(rank desc)._id
    result:
    - projection-1
    - projection-2
    - projection-3

  - name: "After a slice, only the sliced values are sorted"
    query: |
      *[_type == "sliceOrder"][0..2] | order(rank desc)._id
    result:
    - slice-2
    - slice-3
    - slice-1

  - name: "Parameterized sort key"
    query: |
      *[_type == "projectionOrder"] | order(@[$sortOrder] asc)[0...2]._id
    params:
      sortOrder: rank
    result:
    - projection-1
    - projection-3

- name: "Over the whole document set with a slice"
  version: ">= 1.0"
  documents:
  - _id: "doc1"
    _type: "thing"
    n: 3
  - _id: "doc2"
    _type: "thing"
    n: 1
  - _id: "doc3"
    _type: "thing"
    n: 4
  - _id: "doc4"
    _type: "thing"
    n: 1
  - _id: "doc5"
    _type: "thing"
    n: 5

  tests:
  - name: "Ascending with a limiting slice"
    query: '*[] | order(_id asc) [0...3]._id'
    result:
    - "doc1"
    - "doc2"
    - "doc3"

  - name: "Descending with a limiting slice"
    query: '*[] | order(_id desc) [0...2]._id'
    result:
    - "doc5"
    - "doc4"

  - name: "Ascending with an offset slice"
    query: '*[] | order(_id asc) [1...4]._id'
    result:
    - "doc2"
    - "doc3"
    - "doc4"

  - name: "Without a slice"
    query: '*[] | order(_id asc)._id'
    result:
    - "doc1"
    - "doc2"
    - "doc3"
    - "doc4"
    - "doc5"

  - name: "Slice without ordering"
    query: '*[][0...2]._id'
    result:
    - "doc1"
    - "doc2"

  - name: "Non-_id sort key with a limiting slice"
    query: '*[] | order(n asc, _id asc) [0...3]._id'
    result:
    - "doc2"
    - "doc4"
    - "doc1"

