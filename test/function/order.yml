- _id: "one-one-two"
  _type: "order-priority"
  primary: 1
  secondary: 1
  tertiary: 2
- _id: "two-one-one"
  _type: "order-priority"
  primary: 2
  secondary: 1
  tertiary: 1
- _id: "one-two-one"
  _type: "order-priority"
  primary: 1
  secondary: 2
  tertiary: 1
- _id: "two-one-two"
  _type: "order-priority"
  primary: 2
  secondary: 1
  tertiary: 2
- _id: "one-one-one"
  _type: "order-priority"
  primary: 1
  secondary: 1
  tertiary: 1
- _id: "two-two-two"
  _type: "order-priority"
