  value: 0.8
- _id: "3.1"
  _type: "order-decimal"
  value: 3.1
- _id: "3.2"
  _type: "order-decimal"
  value: 3.2
- _id: "20.4"
  _type: "order-decimal"
  value: 20.4
- _id: "neg3.1"
  _type: "order-decimal"
  value: -3.1

- _id: "1"
  _type: "order-integer"
  value: 1
- _id: "2"
