  secondary: 2
  tertiary: 2

tests:
- name: "With namespace"
  version: ">= 1.0"
  query: |
    *[_type=="order-boolean"]|global::order(value asc)[].value
  result: [false, true]

- name: "Document values"
  query: |
    *[_type=="~type~"]|order(value ~dir~)[].value
  tests:
    - variables: {type: "order-boolean", dir: "asc"}
      result: [false, true]
    - variables: {type: "order-boolean", dir: "desc"}
      result: [true, false]
    - variables: {type: "order-decimal", dir: "asc"}
      result: [-3.1, 0.8, 3.1, 3.2, 20.4]
    - variables: {type: "order-decimal", dir: "desc"}
      result: [20.4, 3.2, 3.1, 0.8, -3.1]
    - variables: {type: "order-integer", dir: "asc"}
      result: [-4, 1, 2, 7, 13]
    - variables: {type: "order-null", dir: "asc"}
      result: [null]
    - variables: {type: "order-null", dir: "desc"}
      result: [null]
    - variables: {type: "order-string", dir: "asc"}
      result: ["Aa", "Aå", "A😀", "aA", "aa"]
    - variables: {type: "order-string", dir: "desc"}
      result: ["aa", "aA", "A😀", "Aå", "Aa"]

- name: "Document mixed values"
  version: ">= 1.0"
  query: |
    *[_type in ["order-boolean", "order-decimal", "order-integer", "order-null", "order-string"]]|order(value ~dir~)[].value
  tests:
    - variables: {dir: "asc"}
      result: [-4, -3.1, 0.8, 1, 2, 3.1, 3.2, 7, 13, 20.4, "Aa", "Aå", "A😀", "aA", "aa", false, true, null]
    - variables: {dir: "desc"}
      result: [null, true, false, "aa", "aA", "A😀", "Aå", "Aa", 20.4, 13, 7, 3.2, 3.1, 2, 1, 0.8, -3.1, -4]

- name: "Chained ordering is stable"
  version: ">= 1.0"
  documents:
  - _id: pub-1
    _type: publication
    year: "2020"
    published: null

  - _id: pub-2
    _type: publication
    year: "2022"
    published: null

  - _id: pub-3
    _type: publication
    year: "2021"
    published: null

  - _id: pub-4
    _type: publication
    year: "2022"
    published: "2022-06-01"

  - _id: pub-5
    _type: publication
    year: "2020"
    published: null

  tests:
  - name: "Constant second key preserves the first ordering"
    query: |
      *[_type == "publication"]
        | order(year desc)
        | order(_type desc)
        { _id, year }
    result:
    - _id: pub-2
      year: "2022"
    - _id: pub-4
      year: "2022"
    - _id: pub-3
      year: "2021"
    - _id: pub-1
      year: "2020"
    - _id: pub-5
      year: "2020"

  - name: "Mixed values preserve the first ordering within a group"
    # Nulls sort before strings in desc order. Among the null-published
    # documents, the year desc ordering from the first order() survives.
    query: |
      *[_type == "publication"]
        | order(year desc)
        | order(published desc)
        { _id, year, published }
    result:
    - _id: pub-2
      year: "2022"
      published: null
    - _id: pub-3
      year: "2021"
      published: null
    - _id: pub-1
      year: "2020"
      published: null
    - _id: pub-5
      year: "2020"
      published: null
    - _id: pub-4
      year: "2022"
      published: "2022-06-01"

- name: "With filters and limits"
  version: ">= 1.0"
  documents:
  - _id: art-1
    _type: article
    title: "Alpha"
    year: "2020"
    publishedAt: "2020-03-15"

  - _id: art-2
    _type: article
    title: "Beta"
    year: "2022"
    publishedAt: "2022-07-01"

  - _id: art-3
    _type: article
    title: "Gamma"
    year: "2021"
    publishedAt: "2021-11-20"

  - _id: art-4
    _type: article
    title: "Delta"
    year: "2022"
    publishedAt: "2022-01-10"

  - _id: art-5
    _type: article
    title: "Epsilon"
    year: "2020"
    publishedAt: "2020-09-05"

  # publishedAt is explicitly null
  - _id: art-6
    _type: article
    title: "Zeta"
    year: "2023"
    publishedAt: null

  # publishedAt is missing entirely
  - _id: art-7
    _type: article
    title: "Eta"
    year: "2021"

  # Documents where the sort field is missing on every document
  - _id: svc-1
    _type: service
    name: "Auth"

  - _id: svc-2
    _type: service
    name: "Billing"

  - _id: svc-3
    _type: service
    name: "Cache"

  - _id: svc-4
    _type: service
    name: "DNS"

  - _id: svc-5
    _type: service
    name: "Events"

  tests:
  - name: "Ascending with an inequality-against-null filter"
    query: |
      *[publishedAt != null] | order(publishedAt asc) { _id, publishedAt }
    result:
    - _id: art-1
      publishedAt: "2020-03-15"
    - _id: art-5
      publishedAt: "2020-09-05"
    - _id: art-3
      publishedAt: "2021-11-20"
    - _id: art-4
      publishedAt: "2022-01-10"
    - _id: art-2
      publishedAt: "2022-07-01"

  - name: "Descending with an inequality-against-null filter"
    query: |
      *[publishedAt != null] | order(publishedAt desc) { _id, publishedAt }
    result:
    - _id: art-2
      publishedAt: "2022-07-01"
    - _id: art-4
      publishedAt: "2022-01-10"
    - _id: art-3
      publishedAt: "2021-11-20"
    - _id: art-5
      publishedAt: "2020-09-05"
    - _id: art-1
      publishedAt: "2020-03-15"

  - name: "Inequality-against-null filter with a slice"
    query: |
      *[publishedAt != null] | order(publishedAt asc)[0...3] { _id, publishedAt }
    result:
    - _id: art-1
      publishedAt: "2020-03-15"
    - _id: art-5
      publishedAt: "2020-09-05"
    - _id: art-3
      publishedAt: "2021-11-20"

  - name: "defined() filter"
    query: |
      *[defined(publishedAt)] | order(publishedAt asc) { _id, publishedAt }
    result:
    - _id: art-1
      publishedAt: "2020-03-15"
    - _id: art-5
      publishedAt: "2020-09-05"
    - _id: art-3
      publishedAt: "2021-11-20"
    - _id: art-4
      publishedAt: "2022-01-10"
    - _id: art-2
      publishedAt: "2022-07-01"

  - name: "Absent sort field with a slice"
    # The sort key is null on every document, so ordering is a no-op and
    # the slice must still return the leading documents.
    query: |
      *[_type == "service"] | order(nonExistentField asc)[0...3] { _id }
    result:
    - _id: svc-1
    - _id: svc-2
    - _id: svc-3

  - name: "Absent sort field descending with a slice"
    query: |
      *[_type == "service"] | order(nonExistentField desc)[0...3] { _id }
    result:
    - _id: svc-1
    - _id: svc-2
    - _id: svc-3

  - name: "Absent sort field without a slice"
    query: |
      *[_type == "service"] | order(nonExistentField asc) { _id }
    result:
    - _id: svc-1
    - _id: svc-2
    - _id: svc-3
    - _id: svc-4
    - _id: svc-5

  - name: "Absent sort field with a slice covering everything"
    query: |
      *[_type == "service"] | order(nonExistentField asc)[0...10] { _id }
    result:
    - _id: svc-1
    - _id: svc-2
    - _id: svc-3
    - _id: svc-4
    - _id: svc-5

  - name: "Multiple keys with a limit"
    query: |
      *[_type == "article"] | order(year desc, _id asc)[0...2] { _id, year }
    result:
    - _id: art-6
      year: "2023"
    - _id: art-2
      year: "2022"

  - name: "Multiple keys with a limit spanning a tie"
    query: |
      *[_type == "article"] | order(year desc, _id asc)[0...4] { _id, year }
    result:
    - _id: art-6
      year: "2023"
    - _id: art-2
      year: "2022"
    - _id: art-4
      year: "2022"
    - _id: art-3
      year: "2021"

  - name: "Two ascending keys with a limit"
    query: |
      *[_type == "article"] | order(year asc, publishedAt asc)[0...3] { _id, year, publishedAt }
    result:
    - _id: art-1
      year: "2020"
      publishedAt: "2020-03-15"
    - _id: art-5
      year: "2020"
      publishedAt: "2020-09-05"
    - _id: art-3
      year: "2021"
      publishedAt: "2021-11-20"

  - name: "Two descending keys with a limit"
    query: |
      *[_type == "article"] | order(year desc, publishedAt desc)[0...3] { _id, year, publishedAt }
    result:
    - _id: art-6
      year: "2023"
      publishedAt: null
    - _id: art-2
      year: "2022"
      publishedAt: "2022-07-01"
    - _id: art-4
      year: "2022"
      publishedAt: "2022-01-10"

  - name: "Mixed directions with a limit"
    query: |
      *[_type == "article"] | order(year desc, publishedAt asc)[0...4] { _id, year, publishedAt }
    result:
    - _id: art-6
      year: "2023"
      publishedAt: null
    - _id: art-4
      year: "2022"
      publishedAt: "2022-01-10"
    - _id: art-2
      year: "2022"
      publishedAt: "2022-07-01"
    - _id: art-3
      year: "2021"
      publishedAt: "2021-11-20"

  - name: "Multiple keys without a limit"
    query: |
      *[_type == "article"] | order(year desc, _id asc) { _id, year }
    result:
    - _id: art-6
      year: "2023"
    - _id: art-2
      year: "2022"
    - _id: art-4
      year: "2022"
    - _id: art-3
      year: "2021"
    - _id: art-7
      year: "2021"
    - _id: art-1
      year: "2020"
    - _id: art-5
      year: "2020"

