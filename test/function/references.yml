name: "references() function"
version: ">= 1.0"

documents:
- _id: "a"
  _type: "doc"
  name: "A"
  ref:
    _ref: "b"
  arrref:
    - _ref: "c"
    - _ref: "d"
  objref:
    inner:
      _ref: "e"
- _id: "b"
  _type: "doc"
  name: "B"
- _id: "c"
  _type: "doc"
  name: "C"
- _id: "d"
  _type: "doc"
  name: "D"
- _id: "e"
  _type: "doc"
  name: "E"

- _id: "carrie-henn"
  _type: "moviedb"
  name: "Carrie Henn"
  nationality: "us"
- _id: "sigourney-weaver"
  _type: "moviedb"
  name: "Sigourney Weaver"
  nationality: "us"
  famousFor:
    _ref: "aliens"
    _weak: true
  deeply:
    famousFor:
      _ref: "aliens"
      _weak: true
  deepArray:
  - famousFor:
      _ref: "aliens"
      _weak: true
  deepNestedArray:
  - famousFor:
      reason: "Awesome Movie"
      movie:
        _ref: "aliens"
        _weak: true
- _id: "james-cameron"
  _type: "moviedb"
  name: "James Cameron"
  nationality: "ca"
- _id: "aliens"
  _type: "moviedb"
  title: "Aliens"
  directors:
  - _ref: "james-cameron"
  actors:
  - character: Newt
    actor:
      _ref: "carrie-henn"
  - character: Ellen Ripley
    actor:
      _ref: "sigourney-weaver"
- _id: "gorillas-in-the-mist"
  _type: "moviedb"
  title: "Gorillas in the Mist"
  actors:
  - character: "Dian Fossey"
    actor:
      _ref: "sigourney-weaver"

tests:
- name: "With namespace"
  version: ">= 1.0"
  query: |
    *[global::references("b")]{name}
  result:
  - name: "A"

- name: "Basic"
  query: |
    *[references(~id~)]{name}
  result:
  - name: "A"
  tests:
  - variables: {id: '"b"'}
  - variables: {id: '"c"'}
  - variables: {id: '"d"'}
  - variables: {id: '"e"'}

- name: "Filtered"
  query: |
    *{ref,name}[references(~id~)]{name}
  tests:
  - {variables: {id: '"b"'}, result: [{name: "A"}]}
  - {variables: {id: '"c"'}, result: []}
  - {variables: {id: '"d"'}, result: []}
  - {variables: {id: '"e"'}, result: []}

- name: "Multiple and nested arguments"
  query: |
    *[references(~args~)][]._id
  result:
  - a
  - aliens
  variables:
    args:
    - '"c", "james-cameron"'
    - '["c", "james-cameron"]'
    - '["c"], ["james-cameron"]'
    - '1, null, ["c"], ["james-cameron"]'
    - '1, null, "c", ["james-cameron"]'

- name: "With parent"
  query: |
    *[_id == "james-cameron"]{"refs": *[references(^._id)]._id}[0]
  result:
    refs:
    - "aliens"

- name: "With parent in array"
  query: |
    *[_id == "james-cameron"]{"refs": *[references(~args~)]._id}[0]
  result:
    refs:
    - "aliens"
  variables:
    args:
    - '^._id'
    - '[^._id]'
    - '123, ^._id'
    - '123, [^._id]'

- name: "With parent and constant"
  query: |
    *[_id == "james-cameron"]{"refs": *[references(~args~)]._id}[0]
  result:
    refs:
    - "a"
    - "aliens"
  variables:
    args:
    - '^._id, "c"'
    - '[^._id], "c"'
    - '[^._id], ["c"]'
    - '^._id, ["c"]'
    - '[123, ^._id], "c"'

- name: "Nested two levels"
  query: |
    *[references(~args~)][]._id
  variables:
    args:
    - '[["c"]]'
  result: []

- name: "Subquery"
  query: |
    *[references(*[_type == "moviedb"][]._id)][]._id|order(@)
  result:
  - aliens
  - gorillas-in-the-mist
  - sigourney-weaver

- name: "Invalid arguments"
  query: |
    *[_type == "doc"]{"res": references(~id~)}
  result:
  - {"res": false}
  - {"res": false}
  - {"res": false}
  - {"res": false}
  - {"res": false}
  variables:
    id:
    - '1'
    - 'null'
    - 'true'
    - 'false'

- name: "Incorrect number of arguments"
  query: |
    *[_type == "doc"]{"res": references()}
  valid: false

- name: "Correlated with the parent document"
  documents:
  - _id: author-1
    _type: author
    name: Alice

  - _id: author-2
    _type: author
    name: Bob

  - _id: post-1
    _type: post
    title: Hello
    author:
      _ref: author-1

  - _id: post-2
    _type: post
    title: World
    author:
      _ref: author-1

  - _id: post-3
    _type: post
    title: Goodbye
    author:
      _ref: author-2

  tests:
  - name: "In a projection subquery"
    query: |
      *[_type == "author"] | order(_id) {
        _id,
        "posts": *[_type == "post" && references(^._id)] | order(_id) { _id, title }
      }
    result:
    - _id: author-1
      posts:
      - _id: post-1
        title: Hello
      - _id: post-2
        title: World
    - _id: author-2
      posts:
      - _id: post-3
        title: Goodbye

  - name: "With element access"
    query: |
      *[_type == "author"] | order(_id) {
        _id,
        "latestPost": *[_type == "post" && references(^._id)] | order(_id) [0] { _id }
      }
    result:
    - _id: author-1
      latestPost:
        _id: post-1
    - _id: author-2
      latestPost:
        _id: post-3

  - name: "Counted"
    query: |
      *[_type == "author"] | order(_id) {
        _id,
        "postCount": count(*[_type == "post" && references(^._id)])
      }
    result:
    - _id: author-1
      postCount: 2
    - _id: author-2
      postCount: 1

  - name: "Counted inside a filter"
    query: |
      *[_type == "author" && count(*[references(^._id)]) > 1] | order(_id) { _id }
    result:
    - _id: author-1
