name: "string::startsWith() function"

version: '>= 1.1'

tests:
- name: Basic
  query: |
    string::startsWith(~str~, ~prefix~)
  tests:
  - name: Empty prefix
    variables:
      str: '"a"'
      prefix: '""'
    result: true
  - name: Single character prefix
    variables:
      str: '"abc"'
      prefix: '"a"'
    result: true
  - name: Common prefix, but not fully
    variables:
      str: '"abc"'
      prefix: '"abx"'
    result: false

- name: "Non-string types"
  query: |
    string::startsWith(~str~, "abc")
  variables:
    str:
    - 'null'
    - '{"key": "value"}'
    - '[1, 2]'
    - 'true'
    - '3.14'
  result: null

- name: "Non-string prefix"
  query: |
    string::startsWith("abc", ~prefix~)
  variables:
    prefix:
    - 'null'
    - '{"key": "value"}'
    - '[1, 2]'
    - 'true'
    - '3.14'
  result: null

- name: "In a filter over documents"
  documents:
  - _id: "c-1"
    _type: "child"
    name: "alpha-leaf"
  - _id: "c-2"
    _type: "child"
    name: "alpha-stem"
  tests:
  - name: "Empty prefix"
    query: |
      *[_id == "c-1"][string::startsWith(name, "")]._id
    result:
    - "c-1"

  - name: "Non-empty prefix"
    query: |
      *[_id == "c-1"][string::startsWith(name, "alpha")]._id
    result:
    - "c-1"
