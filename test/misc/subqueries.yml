        _type: "parent"
        tag: "red"
        created: "2024-01-15T10:00:00Z"
      - _id: "p-2"
        _type: "parent"
        tag: "blue"
        created: "2024-06-20T15:30:00.500Z"
      - _id: "p-3"
        _type: "parent"
        tag: "green"
        created: "2025-03-01T00:00:00Z"

    query: |
      *[_id == "p-2"] {
        _id,
        "earlier": *[_type == "parent" && dateTime(created) < dateTime(^.created)] | order(_id) { _id }
      }
    result:
      - _id: "p-2"
        earlier:
          - _id: "p-1"

  - name: "Parent reference compared against Portable Text"
    version: ">= 1.0"
    features:
      - portableText
    documents:
      - _id: "pt-doc"
        _type: "pt"
        blocks:
          - _type: "block"
            children:
              - _type: "span"
                text: "alpha-leaf"
      - _id: "pt-other"
        _type: "pt-search"
        needle: "alpha-leaf"

    query: |
      *[_id == "pt-other"] {
        _id,
        "found": *[_id == "pt-doc" && pt::text(blocks) == ^.needle]._id
      }
    result:
      - _id: "pt-other"
        found:
          - "pt-doc"
