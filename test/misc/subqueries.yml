    query: |
      {
        "numericJoin": *[_type == "sensor"] | order(name) {
          name,
          numericCode,
          "readings": *[_type == "reading" && sensorCode == ^.numericCode] | order(timestamp) {
            value,
            timestamp
          }
        },
        "arrayJoinAttempt": *[_type == "sensor"] | order(name) {
          name,
          tags,
          "matchingByTags": *[_type == "sensor" && tags == ^.tags && _id != ^._id]{name}
        },
        "objectJoinAttempt": *[_type == "sensor"] | order(name) {
          name,
          config,
          "matchingByConfig": *[_type == "sensor" && config == ^.config && _id != ^._id]{name}
        }
      }
    result:
      arrayJoinAttempt:
        - matchingByTags: []
          name: Humidity Sensor
