name: "In operator"
version: ">= 1.0"

tests:
- name: Invalid
  query: |
    ~left~ in ~right~
  result: false
  tests:
  - variables: {left: 'a[].b[]', right: '["foo"]'}
  - variables: {left: '["foo"]', right: '[["foo"]]'}
  - variables: {left: '[]', right: '[[]]'}

- name: "Array"
  query: |
    ~el~ in ~arr~
  tests:
  - result: true
    variables:
      arr: '[1, "1", null, true, false]'
      el:
      - '1'
      - '"1"'
      - 'null'
      - 'true'
      - 'false'

  - result: false
    tests:
      - variables: {el: '1', arr: '["1", null, true]'}
      - variables: {el: '1', arr: '["1", 1.1, null, true]'}
      - variables: {el: 'true', arr: '["1", null, false]'}
      - variables: {el: 'false', arr: '["1", null, true]'}
      - variables: {el: '[]', arr: '[[]]'}
      - variables: {el: '{}', arr: '[{}, []]'}

- name: "Numeric range"
  query: |
    ~el~ in ~arr~
  tests:
  - result: true
    variables:
      arr: '1..5'
      el:
      - '1'
      - '2'
      - '2.5'
      - '4'
      - '5'

  - result: true
    variables:
      arr: '1...5'
      el:
      - '1'
      - '2'
      - '2.5'
      - '4'

  - result: false
    variables:
      arr: '1...5'
      el:
      - '0'
      - '5'

  - result: null
    variables:
      arr: '1...5'
      el:
      - 'true'
      - 'false'
      - 'null'
      - '{}'

- name: "String range"
  query: |
    ~el~ in ~arr~
  tests:
  - result: true
    variables:
      arr: '"a".."c"'
      el:
      - '"a"'
      - '"ab"'
      - '"bbbb"'
      - '"b"'
      - '"c"'

  - result: true
    variables:
      arr: '"a"..."c"'
      el:
      - '"a"'
      - '"ab"'
      - '"bbbb"'
      - '"b"'

  - result: false
    variables:
      arr: '"a"..."c"'
      el:
      - '"0"'
      - '"c"'

  - result: null
    variables:
      arr: '"a"..."c"'
      el:
      - 'true'
      - 'false'
      - 'null'
      - '{}'

- name: "Path"
  query: |
    ~el~ in path(~path~)
  genFilter: false
  tests:
  - result: true
    variables:
      path: '"a.*"'
      el:
      - '"a.b"'
      - 'path("a.b")'

  - result: false
    variables:
      path: '"a.*"'
      el:
      - '"b.a.b"'
      - 'path("b.a.b")'
      - '"a"'
      - 'path("a")'
      - '"a.b.c"'
      - 'path("a.b.c")'

  - result: true
    variables:
      path: '"a.**"'
      el:
      - '"a.b.c"'
      - 'path("a.b.c")'
      - '"a.b.c.c"'
      - 'path("a.b.c.c")'

- name: "Unknown types"
  result: null
  query: |
    1 in ~arr~
  variables:
    arr:
    - '{}'
    - '"1"'
    - 'true'
    - 'false'
    - 'null'

- name: "_id in path"
  documents:
  - _id: "a"
    _type: "doc"
  - _id: "a.b"
    _type: "doc"
  - _id: "a.b.c"
    _type: "doc"
  - _id: "b.c"
    _type: "doc"
  tests:
  - query: |
      *[_id in path("*")][]._id
    result: ["a"]

  - query: |
      *[_id in path("**")] | order(_id)[]._id
    result: ["a", "a.b", "a.b.c", "b.c"]

  - query: |
      *[_id in path("a.*")][]._id
    result: ["a.b"]

  - query: |
      *[_id in path("a.**")] | order(_id)[]._id
    result: ["a.b", "a.b.c"]

  - query: |
      *[path(_id) in path("*")][]._id
    result: ["a"]

  - query: |
      *[path(_id) in path("a.*")][]._id
    result: ["a.b"]

  - query: |
      *[path(_id) in path("a.**")] | order(_id)[]._id
    result: ["a.b", "a.b.c"]

  - query: |
      *[path(_id) in path("**")] | order(_id)[]._id
    result: ["a", "a.b", "a.b.c", "b.c"]

- name: "_id not in path"
  documents:
    - _id: "a"
      _type: "doc"
    - _id: "a.b"
      _type: "doc"
  tests:
    - query: |
        *[!(_id in path("a.*"))][]._id
      result: ["a"]

- name: "Mixed primitive containers"
  documents:
  - _id: "missing"
    _type: "item"
  - _id: "null"
    _type: "item"
    value: null
  - _id: "string"
    _type: "item"
    value: "target"
  - _id: "other-string"
    _type: "item"
    value: "other"
  - _id: "number"
    _type: "item"
    value: 2
  - _id: "other-number"
    _type: "item"
    value: 3
  - _id: "bool"
    _type: "item"
    value: true
  - _id: "other-bool"
    _type: "item"
    value: false
  tests:
  - name: "A null element matches missing and null fields"
    query: "*[value in $values]._id | order(@ asc)"
    params:
      values: [null]
    result:
    - "missing"
    - "null"

  - name: "A heterogeneous container matches each comparable type"
    query: "*[value in $values]._id | order(@ asc)"
    params:
      values: [null, "target", 2, true]
    result:
    - "bool"
    - "missing"
    - "null"
    - "number"
    - "string"

- name: "Right-hand sides that cannot be containers"
  documents:
  - _id: first
    _type: article
    foo: alpha
    text: Alpha
    values: "alpha,beta"
  - _id: second
    _type: article
    foo: beta
    text: Beta
    values: "alpha,beta"
  tests:
  - name: "A string result is not a container"
    query: "*[foo in lower(text)]._id"
    result: []

  - name: "A conjunction with a non-container stays empty"
    query: "*[_type == \"article\" && foo in lower(text)]._id"
    result: []

  - name: "Negating a non-container membership stays empty"
    query: "*[!(foo in lower(text))]._id"
    result: []

  - name: "Comparing a non-container membership preserves null"
    query: "*[(foo in lower(text)) == false]._id"
    result: []

  - name: "An array-returning function is a valid container"
    query: "*[foo in string::split(values, \",\")]._id | order(@ asc)"
    result:
    - first
    - second

- name: "Portable Text right-hand sides cannot be containers"
  features:
  - portableText
  documents:
  - _id: first
    _type: article
    foo: alpha
    text: Alpha
    body:
      _type: block
      children:
      - _type: span
        text: alpha
  - _id: second
    _type: article
    foo: beta
    text: Beta
    body:
      _type: block
      children:
      - _type: span
        text: beta
  tests:
  - name: "A Portable Text result is not a container"
    query: "*[foo in pt::text(body)]._id"
    result: []

  - name: "A disjunction of non-container memberships stays empty"
    query: "*[foo in lower(text) || foo in pt::text(body)]._id"
    result: []
