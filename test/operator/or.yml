name: "Or operator"
version: ">= 1.0"

tests:
- variables:
    T: "true"
    F: "false"
    N: "null"
    S: '"abc"'
    I: 123
  tests:

  # Basic true/false
  - query: ~T~ || ~T~
    result: true
  - query: ~F~ || ~T~
    result: true
  - query: ~T~ || ~F~
    result: true
  - query: ~F~ || ~F~
    result: false

  # Basic null values
  - query: ~T~ || ~N~
    result: true
  - query: ~N~ || ~T~
    result: true
  - query: ~F~ || ~N~
    result: null
  - query: ~N~ || ~F~
    result: null
  - query: ~N~ || ~N~
    result: null

  # Coerced strings
  - query: ~T~ || ~S~
    result: true
  - query: ~S~ || ~T~
    result: true
  - query: ~F~ || ~S~
    result: null
  - query: ~S~ || ~F~
    result: null
  - query: ~S~ || ~S~
    result: null

  # Coerced integers
  - query: ~T~ || ~I~
    result: true
  - query: ~I~ || ~T~
    result: true
  - query: ~F~ || ~I~
    result: null
  - query: ~I~ || ~F~
    result: null
  - query: ~I~ || ~I~
    result: null

- name: "Over documents"
  documents:
  - _id: "area-1"
    _type: "area"
    name: "Area One"
  - _id: "area-2"
    _type: "area"
    name: "Area Two"
  - _id: "region-1"
    _type: "region"
    name: "Region One"
  - _id: "special-1"
    _type: "special"
  - _id: "other-1"
    _type: "article"
    name: "Unrelated"
  query: |
    *[_type == "area" || _type == "region"] | order(_id asc) { _id, _type }
  result:
  - _id: "area-1"
    _type: "area"
  - _id: "area-2"
    _type: "area"
  - _id: "region-1"
    _type: "region"